<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Dish Generator</title>
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <div class="container">

      <h1>Random Dish Generator</h1>

      <button id="new-dish-btn">New Dish</button>
      <button id="prev-dish-btn">Previous Dish</button>
      <button id="save-dish-btn">⭐ Save to Favorites</button>

      <h2 id="dish-name"></h2>

      <div id="image-container">
        <img id="dish-image" src="" alt="Dish Image" />
      </div>

      <div id="ingredients-section">
        <h2>Ingredients:</h2>
        <ul id="ingredients-list"></ul>
      </div>

      <div id="instructions-section">
        <h2>Instructions:</h2>
        <p id="instructions-text"></p>
      </div>

      <div id="favorites-section">
        <h2>Favorites:</h2>
        <ul id="favorites-list"></ul>
      </div>

    </div>

    <script src="index.js"></script>
  </body>
</html>
